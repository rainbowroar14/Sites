<script>
"use strict";

const P32=PAL.map(h=>{const n=parseInt(h.slice(1),16);return 0xff000000|((n&255)<<16)|(n&0xff00)|(n>>16)});
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let img=ctx.createImageData(W,H),buf=new Uint32Array(img.data.buffer);
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>v/16);
const bay=(x,y)=>BAY[((y&3)<<2)|(x&3)];
function hash(n){n=(n|0)^0x9e3779b9;n=Math.imul(n^(n>>>16),0x85ebca6b);n=Math.imul(n^(n>>>13),0xc2b2ae35);return ((n^(n>>>16))>>>0)/4294967296;}
function hash2(a,b){return hash(Math.imul(a,73856093)^Math.imul(b,19349663));}
function vnoise(x,seed){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return hash(i*31+seed)*(1-u)+hash((i+1)*31+seed)*u;}
function vn2(x,y,s){const i=Math.floor(x),j=Math.floor(y),f=x-i,g=y-j,u=f*f*(3-2*f),v=g*g*(3-2*g);const a=hash2(i+s,j),b=hash2(i+1+s,j),c=hash2(i+s,j+1),d=hash2(i+1+s,j+1);return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;}
function fbm(x,seed){return vnoise(x/180,seed)*0.55+vnoise(x/60,seed+7)*0.3+vnoise(x/20,seed+13)*0.15;}
const floorY=x=>WD-110+fbm(x,1)*90;
// ---- RAVINE: crack at RVX down to a big cavern (open-space test used by diver/spear/cage/render)
const RVX=1000,CAVY=3170,CAVRX=430,CAVRY=330,DARK0=1650,DARK1=2450;
// profile (half-width by depth): entrance -> TIGHT squeeze -> chamber -> tight neck -> cavern
const RVP=[[1600,46],[1700,40],[1760,30],[1830,20],[1880,9],[2000,9],[2070,28],[2180,70],[2380,66],[2490,30],[2560,9],[2680,9],[2750,26],[2860,48],[2900,60]];
function crkW(y){if(y<=RVP[0][0])return RVP[0][1];for(let i=1;i<RVP.length;i++)if(y<=RVP[i][0]){const [y0,a]=RVP[i-1],[y1,b]=RVP[i],t=(y-y0)/(y1-y0),u=t*t*(3-2*t);return a+(b-a)*u;}return RVP[RVP.length-1][1];}
const crkC=y=>RVX+Math.sin(y*0.006)*18+Math.sin(y*0.017)*6;
const crkA=y=>2+crkW(y)*0.22,bump=(y,c,w)=>Math.max(0,1-((y-c)/w)**2);
// walls wobble independently (noise only widens, so squeezes keep their minimum); chamber ledge (left) + overhang (right)
const crkL=y=>crkC(y)-crkW(y)-crkA(y)*(vnoise(y/23,41)*0.7+vnoise(y/7,43)*0.3)+26*Math.sqrt(bump(y,2236,12))+14*Math.sqrt(bump(y,2420,9));
const crkR=y=>crkC(y)+crkW(y)+crkA(y)*(vnoise(y/19,47)*0.7+vnoise(y/6,53)*0.3)-24*Math.sqrt(bump(y,2320,10))-12*Math.sqrt(bump(y,2150,8));
const CRKEND=CAVY-CAVRY+50;
const nearRav=x=>Math.abs(x-RVX)<CAVRX*1.2+24;
function inCave(x,y){const dx=(x-RVX)/CAVRX,dy=(y-CAVY)/CAVRY,a=Math.atan2(dy,dx)+Math.PI,r=1+(vnoise(a*3+7,23)-0.5)*0.22+(vnoise(a*9,29)-0.5)*0.08;return dx*dx+dy*dy<r*r*(dy>0?0.9:1);}
function isOpen(x,y){if(y<floorY(x))return true;if(!nearRav(x))return false;if(y<CRKEND&&x>crkL(y)&&x<crkR(y))return true;return inCave(x,y);}
function caveQ(x,y){const dx=(x-RVX)/CAVRX,dy=(y-CAVY)/CAVRY,a=Math.atan2(dy,dx)+Math.PI,r=1+(vnoise(a*3+7,23)-0.5)*0.22+(vnoise(a*9,29)-0.5)*0.08;return Math.sqrt((dx*dx+dy*dy)/(r*r*(dy>0?0.9:1)));}
const useRav=(x,y)=>nearRav(x)&&(y>floorY(x)+1||isOpen(x,floorY(x)+2)||isOpen(x-6,floorY(x-6)+2)||isOpen(x+6,floorY(x+6)+2));

// ---- ravine look: back wall inside the crack, lit/shaded rock rim, cracks, pebbles, sanded ledges
function ravPix(wx,wy,fy){const inCrk=wy<CRKEND+40;let l=0,r=0,dE=99,side=0;
  if(inCrk){l=crkL(wy);r=crkR(wy);if(wx>l&&wx<r&&wy<CRKEND){const de=Math.min(wx-l,r-wx),n=vn2(wx/14,wy/10,17),k=vn2(wx/5,wy/3,19);
      if(de<2.5)return 0;if(de<5&&bay(wx,wy)<0.5)return 0;return n>0.62?(k>0.5&&bay(wx,wy)<0.6?8:1):(n<0.3&&bay(wx,wy)<0.5?0:1);}
    if(wx<=l){dE=l-wx;side=-1;}else if(wx>=r){dE=wx-r;side=1;}}
  if(inCave(wx,wy))return (vn2(wx/38,wy/30,8)*0.7+0.25-(wy-1800)/3000>bay(wx,wy))?2:1;
  if(wy>CAVY-CAVRY-20){const q=caveQ(wx,wy);const d2=(q-1)*CAVRY;if(d2<dE){dE=d2;side=0;}}
  if(dE>7||wy<fy)return -1;
  const b=bay(wx,wy),up=isOpen(wx,wy-1)||isOpen(wx,wy-2);
  if(up&&dE<6)return b<0.6?9:13;                        // sand on ledge tops / lip
  if(dE<1)return 0;                                       // dark crisp edge
  if(side>0)return dE<2.5?34:(b<1-(dE-2.5)/4.5?35:8);     // right wall faces the top-left light: lit rim falling off
  if(side<0)return dE<2?35:(b<1-(dE-2)/5?17:8);           // left wall in shadow
  return dE<2.5?35:(b<1-(dE-2.5)/4.5?17:8);}
const LIPB=[[-14,8],[-30,5],[-44,3],[12,10],[30,6],[46,4]],LIPK=[[-9,95],[-19,70],[-36,120],[8,80],[20,130],[38,60]],LIPC=[[-24,0],[16,1],[42,0]];
function drawRavLip(T,ox,oy){const f0=floorY(RVX),l=crkL(f0+4),r=crkR(f0+4);if(r+80<cx||l-80>cx+W||f0-160>cy+H||f0+40<cy)return;
  for(const [dx,h] of LIPK){const x=Math.round(dx<0?l+dx:r+dx);drawKelp({x,h,ph:x*0.37,sp:0.3,seed:x,lip:1},T,1,true);}
  const CO=[".1.1.1.","1.1.1.1",".11.11.","..111..","...1...","...1..."];
  for(const [dx,k] of LIPC){const x0=Math.round((dx<0?l+dx:r+dx)-3),y0=Math.round(floorY(x0+3)-5);for(let j=0;j<6;j++)for(let i=0;i<7;i++)if(CO[j][i]==='1')put(x0+i-ox,y0+j-oy,k?(bay(i,j)<0.5?25:19):(bay(i,j)<0.5?19:20));}
  for(const [dx,rr] of LIPB){const rx=dx<0?l+dx:r+dx,ry=floorY(rx)+rr*0.3;
    for(let y=-rr;y<=rr*0.4;y++)for(let x=-rr*1.3;x<=rr*1.3;x++){if((x/1.3)**2+y*y>rr*rr)continue;const X=Math.round(rx+x-cx),Y=Math.round(ry+y-cy);
      const lit=(-x-y)/(rr*1.6)+0.3;const edge=(x/1.3)**2+y*y>(rr-1.2)*(rr-1.2);put(X,Y,edge&&(x>0||y>0)?0:(lit>bay(X+ox,Y+oy)+0.25?9:(lit<-0.2&&bay(X,Y)<0.6?0:8)));}}}
function floorAt(x,y){if(!nearRav(x))return floorY(x);let yy=Math.max(y,0);if(!isOpen(x,yy))return yy;for(let i=0;i<1800&&isOpen(x,yy);i++)yy+=2;return yy;}
const farFloorY=x=>WD-150+fbm(x,5)*110;
// water ramp top->bottom: 5,4,3,2,1,0
const RAMP=[5,4,3,2,1,0];
function waterIdx(wx,wy){let t=Math.min(Math.max(wy/(WD-120),0),1);t=Math.pow(t,0.8)*5;const lo=Math.floor(t),f=t-lo;return RAMP[Math.min(5,lo+(f>bay(wx,wy)?1:0))];}
const surfY=(x,t)=>4.2*Math.sin(x*0.028-t*0.9)+2.1*Math.sin(x*0.067+t*0.55)+0.8*Math.sin(x*0.15-t*1.3);
const BOAT=["...........00000000000.........", "..........0444444444440........", "..........04333333333440.......", ".........0443333333333440......", ".........04333333333333440.....", "000000000000000000000000000000.", "0444444444444444444444444444440", "0444444444444444444444444444440", "024242424242424242424242424220.", "02222222222222222222222222220..", "0222222222222222222222222220...", "0221212121212121212122111110...", ".0121212121212121212111110.....", "..011111111111111111111100.....", "...0000000000000000000000......", "..............................."];const BPAL=["#1a1420","#7a1c2c","#c0303a","#2a4a6a","#f2ece0"].map(h=>{const n=parseInt(h.slice(1),16);return 0xff000000|((n&255)<<16)|(n&0xff00)|(n>>16)});
let cx=30,cy=-90,vx=0,vy=0;const keys={};
const B={x:150,y:0,vx:0,vy:0,ang:0,face:-1,air:false,spd:0};let parts=[],splashT=-9,airT=0;
function spawn(x,y,vx,vy,life,kind){if(parts.length<1600)parts.push({x,y,vx,vy,life,max:life,kind,s:Math.random()<0.4?2:1});}
function splash(x,y,n,p){for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-0.5)*2.2;const v=(24+Math.random()*50)*p;spawn(x+(Math.random()-0.5)*14,y,Math.cos(a)*v,Math.sin(a)*v,0.6+Math.random()*0.7,0);}}
function physics(dt,T){
  const ix=(talk.on||fish.st||DV.on)?0:(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),iy=(talk.on||fish.st||DV.on)?0:(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(ix)B.face=ix;
  const sy=surfY(B.x,T),d=B.y-sy, inW=d>-1.5, wasAir=B.air;
  const slope=(surfY(B.x+2,T)-surfY(B.x-2,T))/4;
  const G=150;let ax=0,ay=G;
  if(inW){
    const dir=[B.face*Math.cos(B.ang),-Math.sin(B.ang)];
    const th=Math.abs(ix)*330;ax+=dir[0]*th;ay+=dir[1]*th;
    if(iy>0&&d>-1){ay+=120;}
    const buoy=G*(1+d/5.2)*(iy>0?0.7:1)+(d>13?(d-13)*90:0);
    if(d>0)ay-=buoy; else ay-=G*(1+d/1.5)*0.9;
    const dr=Math.exp(-0.9*dt),dv=Math.exp(-(d>4?2.2:1.0)*dt);B.vx*=dr;B.vy*=dv;
    ax+=-slope*30;if(!ix)B.vx*=Math.exp(-0.8*dt);
    {const bowY=surfY(B.x+B.face*11,T),stY=surfY(B.x-B.face*11,T),wa=Math.atan((stY-bowY)/22)*1.7;
     B.po=B.po||0;if(iy)B.po=Math.max(-0.9,Math.min(0.9,B.po-iy*1.6*dt));else B.po*=Math.exp(-2.5*dt);
     if(d<5){const tgt=wa+B.po;B.ang+=(tgt-B.ang)*Math.min(1,8*dt);}else if(iy)B.ang+=-iy*1.6*dt;else B.ang+=(0-B.ang)*Math.min(1,3*dt);
     const wv=(surfY(B.x,T+0.02)-surfY(B.x,T))/0.02;if(wv<0&&d>-2&&d<6){const lift=wv*1.25;if(B.vy>lift)B.vy+=(lift-B.vy)*Math.min(1,10*dt);}}
    const sx=B.x-B.face*Math.cos(B.ang)*14,sy2=surfY(sx,T);
    if(th&&d<10){const n=2+Math.floor(Math.abs(B.vx)/60);
      for(let i=0;i<n;i++){const a=(30+Math.random()*40)*Math.PI/180,v=35+Math.random()*50+Math.abs(B.vx)*0.13;
        spawn(sx,sy2-1,-B.face*Math.cos(a)*v+B.vx*0.3,-Math.sin(a)*v,0.5+Math.random()*0.7,0);}
      for(let i=0;i<2;i++){const hx=B.x+(Math.random()-0.5)*21,a=(60+Math.random()*25)*Math.PI/180,v=18+Math.random()*35;
        spawn(hx,surfY(hx,T)-1,(Math.random()-0.5)*30+B.vx*0.5,-Math.sin(a)*v,0.4+Math.random()*0.5,0);}}
    if(Math.abs(B.vx)>30&&d<10&&Math.random()<0.9)spawn(sx,sy2,0,0,1.2+Math.random()*0.8,3);
    if(d<8&&Math.abs(slope*B.vx)>45&&Math.random()<0.25)splash(B.x+B.face*13,surfY(B.x+B.face*13,T),12,0.8);
    if(th&&d>10)spawn(sx,B.y,-B.face*10*Math.random(),-5,1+Math.random(),2);
  }else{
    B.vx*=Math.exp(-0.15*dt);
    if(ix){ax+=ix*33;
      if(Math.random()<0.7){const px=B.x-B.face*Math.cos(B.ang)*16,py=B.y+Math.sin(B.ang)*16;spawn(px,py,-B.face*(20+Math.random()*30)+B.vx*0.5,(Math.random()-0.3)*20+B.vy*0.5,0.25+Math.random()*0.25,4);}}
    if(iy) B.ang+=-iy*1.4*dt; else {const tgt=Math.atan2(-B.vy,Math.abs(B.vx)+20);B.ang+=(tgt-B.ang)*Math.min(1,1.5*dt);}
  }

  B.vx+=ax*dt;B.vy+=ay*dt;
  const sp=Math.hypot(B.vx,B.vy);if(sp>360){B.vx*=360/sp;B.vy*=360/sp;}
  B.x+=B.vx*dt;B.y+=B.vy*dt;
  if(B.x<WALLX+17){B.x=WALLX+17;if(B.vx<0)B.vx=-B.vx*0.35;}
  {const cap=surfY(B.x,T)+21;if(B.y>cap){B.y=cap;if(B.vy>0)B.vy*=-0.3;}}

  if(B.air&&!wasAir&&B.vy<-40){B.vy*=1.5;B.vy-=Math.abs(B.vx)*0.15*Math.max(0,Math.sin(B.ang));splash(B.x,surfY(B.x,T),14,0.8);airT=T;}
  if(!B.air&&wasAir){const imp=Math.max(0,B.vy);splash(B.x,surfY(B.x,T),28+Math.min(50,imp/3),0.8+imp/200);B.vy*=0.35;B.vx*=0.85;splashT=T;}
  const fy=floorY(B.x)-7;if(B.y>fy){B.y=fy;if(B.vy>0)B.vy=0;const fs=(floorY(B.x+3)-floorY(B.x-3))/6;B.vx+=fs*40*dt;}
  if(DV.on){B.vx*=Math.exp(-2*dt);}

  for(const p of parts){p.life-=dt;const pd=p.y-surfY(p.x,T);
    if(p.kind==4){p.vx*=0.9;p.vy*=0.9;p.x+=p.vx*dt;p.y+=p.vy*dt;continue;}

}
// ---- fishing: 0 idle, 1 flick, 2 flying, 3 sinking/resting, 4 reeling
const fish={st:0,t:0,x:0,y:0,vx:0,vy:0,rod:0,load:[],stick:null,tick:0};let rodTip=[0,0];
const ROD_CAP=10;
function hookKeys(){return [(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)];}
function rodW(){let w=0;for(const f of fish.load)w+=(FW8[f.k]||1);return w;}
function rodFit(k){return rodW()+(FW8[k]||1)<=ROD_CAP;}
function rodFullMsg(T){if(T<(fish.fullT||0))return;fish.fullT=T+1.2;cageMsg(rodW()>=ROD_CAP?'ROD FULL':'TOO HEAVY',T,1.2);}
function releaseStick(){if(fish.stick){fish.stick.onHook=false;fish.stick=null;}}
function clearCast(){releaseStick();fish.load.length=0;fish.caught=null;fish.tick=0;fish.hvx=0;fish.hvy=0;}

function mouthOx(e){return (e.face||-1)*(e.k==='tuna'?16:28);}
function hookHasHp(e){return e.k==='tuna'||e.k==='mako'||e.hp!==undefined||e.maxhp;}
function finishHook(e,T){e.onHook=false;if(fish.stick===e)fish.stick=null;const i=solo.indexOf(e);if(i>=0)solo.splice(i,1);for(const s of solo)if(s.chase===e)s.chase=null;bleed(e.x,e.y,8);if(!rodFit(e.k)){rodFullMsg(T);return;}secureCatch(e.k,T);}
function hookDamage(e,T){if(e.maxhp===undefined)e.maxhp=e.k==='tuna'?2:e.k==='mako'?3:2;if(e.hp===undefined)e.hp=e.maxhp;e.hp--;e.hpShow=T+3;e.flash=T+0.2;fish.tug=1;fish.tick=T+0.5;bleed(e.x,e.y,e.hp<=0?8:4);if(e.hp<=0)finishHook(e,T);}
function hookOn(e,T){const base=e.k==='tuna'?2:e.k==='mako'?3:(e.maxhp||2);if(e.maxhp===undefined)e.maxhp=base;if(e.hp===undefined)e.hp=e.maxhp;e.onHook=true;e.chase=null;fish.stick=e;hookDamage(e,T);}
function castKey(){if(fish.st===0){fish.st=1;fish.t=0;clearCast();}else if(fish.st>=2)fish.st=4;}
function steerHook(dt,T){const [kx,ky]=hookKeys();let hvx=fish.hvx||0,hvy=fish.hvy||0;hvx+=kx*150*dt;hvy+=ky*140*dt;if(!ky)hvy+=48*dt;
  hvx*=Math.exp(-2.2*dt);hvy*=Math.exp(-2.4*dt);hvx=Math.max(-88,Math.min(88,hvx));hvy=Math.max(-72,Math.min(96,hvy));fish.hvx=hvx;fish.hvy=hvy;
  fish.x+=hvx*dt;fish.y+=hvy*dt;if(fish.x<WALLX+4){fish.x=WALLX+4;fish.hvx=0;}
  const sf=surfY(fish.x,T)+2;if(fish.y<sf){fish.y=sf;if(fish.hvy<0)fish.hvy=0;}
  const fl=floorY(fish.x)-4;if(fish.y>fl){fish.y=fl;if(fish.hvy>0)fish.hvy=0;}}
function steerStuck(e,dt){const [kx,ky]=hookKeys();e.vx+=kx*170*dt;e.vy+=ky*150*dt;e.vx*=Math.exp(-2*dt);e.vy*=Math.exp(-2*dt);e.vx=Math.max(-80,Math.min(80,e.vx));e.vy=Math.max(-70,Math.min(70,e.vy));}
function updFish(dt,T){fish.t+=dt;
  if(fish.st===1){const t=fish.t;fish.rod=t<0.15?0.7*t/0.15:Math.max(-0.5,0.7-1.2*(t-0.15)/0.12);
    if(t>=0.24){fish.st=2;fish.x=rodTip[0];fish.y=rodTip[1];fish.vx=-B.face*75+B.vx*0.3;fish.vy=-55;}}

function gjSteer(tx,ty,sp,dt,T){const dx=tx-GJ.x,dy=ty-GJ.y,d=Math.hypot(dx,dy)||1,pul=0.55+0.45*Math.max(0,Math.sin(T*1000/GJS.dur/4*Math.PI*2));

function updBoss(dt,T){if(PHP.hp<PHP.max){if(!PHP.next)PHP.next=T+120;if(T>=PHP.next){PHP.hp++;PHP.next=PHP.hp<PHP.max?T+120:0;cageMsg('+1 HP',T,1.5);}}else PHP.next=0;

  for(const tn of GJ.tents){const N=tn.n;for(let i=4;i<N.length;i+=3)jellyHurtFish(N[i].x,N[i].y,6,T);}}

function kingTentTips(wx,wy,ang,T,f){const c=Math.cos(ang),s=Math.sin(ang),pts=[];for(let k=0;k<5;k++){let u=-16+k*8,v=8;for(let i=0;i<22;i++){u+=Math.sin(T*1.2+k+i*0.3)*0.25+0.35;v+=1.6;if(i===10||i===21)pts.push([wx+c*u-s*v,wy+s*u+c*v]);}}return pts;}
