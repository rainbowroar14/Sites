function kelpLook(x){const a=KELP0-KELP_BLEND,b=KELP1+KELP_BLEND;if(x<=a||x>=b)return 0;if(x<KELP0)return smooth01((x-a)/KELP_BLEND);if(x>KELP1)return smooth01((b-x)/KELP_BLEND);return 1;}
function tropShelfT(x){return tropLook(x);}
function tropFloor(x){return 850+Math.sin(x*0.0034)*16+Math.sin(x*0.0105)*8+(fbm(x+500,4)-0.5)*24;}
function floorY(x){const deep=WD-110+fbm(x,1)*90,shelf=tropFloor(x),t=tropShelfT(x);if(t<=0)return deep;if(t>=1)return shelf;return deep+(shelf-deep)*t;}

function reefSc(k,kind){return RFSC[kind+(k==="dolphin"?"D":k==="puffer"?"P":"N")];}

function crkW(y){if(y<=RVP[0][0])return RVP[0][1];for(let i=1;i<RVP.length;i++)if(y<=RVP[i][0]){const [y0,a]=RVP[i-1],[y1,b]=RVP[i],t=(y-y0)/(y1-y0),u=t*t*(3-2*t);return a+(b-a)*u;}return RVP[RVP.length-1][1];}
